<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{

min-height:100vh;

background-image:
linear-gradient(rgba(0,0,0,.55),
rgba(0,0,0,.55)),
url("https://lh3.googleusercontent.com/d/1QQOerfYlaDnLQNdhSZYy4bQlBHjkeUKc");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

padding:20px;
}

.contenedor{

width:95%;
max-width:1200px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(8px);

border-radius:30px;

padding:40px;

text-align:center;
}

h1{

color:white;

font-size:50px;

margin-bottom:15px;
}

p{

font-size:22px;

margin-bottom:35px;
}

.botones{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:20px;
}

.boton{

background:#005bea;

color:white;

text-decoration:none;

padding:25px;

border-radius:20px;

font-size:22px;

font-weight:bold;

transition:.3s;

display:flex;

justify-content:center;
align-items:center;

min-height:110px;
}

.boton:hover{

background:#003c8f;

transform:translateY(-5px);
}

.volver{

margin-top:40px;
}

.volver a{

background:#ff9800;

padding:15px 35px;

border-radius:50px;

text-decoration:none;

color:white;

font-weight:bold;
}

@media(max-width:768px){

h1{
font-size:32px;
}

p{
font-size:18px;
}

.boton{
font-size:18px;
min-height:90px;
}

}
